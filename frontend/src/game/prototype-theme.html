<body>
<div class="probe" id="probe" data-variant="a">
  <header class="probe-header"><span class="mark"><b>二</b> Double Riichi</span><span class="context" id="direction-context"></span></header>
  <nav class="surface-nav" aria-label="比較する画面" id="surface-nav"></nav>
  <main class="shell" id="screen"></main>
</div>
<aside class="tools" aria-label="試作の切り替え"><p><strong>方向性の比較試作・製品画面ではありません。</strong> <small id="direction-note"></small></p><div class="switch"><button type="button" id="prev" aria-label="前の案">←</button><strong id="direction-name"></strong><button type="button" id="next" aria-label="次の案">→</button></div></aside>
<script>
// Three visual worlds, one set of illustrative—not authoritative—game facts.
const tiles=['Man2','Man3','Man4','Pin4','Pin5-Dora','Pin6','Sou2','Sou3','Chun','Chun','Chun','Man7','Man7'];
const asset=(id)=>`../assets/tiles/Regular/${id}.svg`;
const tile=(id,cls='')=>`<span class="tile ${cls}"><img src="${asset(id)}" alt="${id}"></span>`;
const hand=()=>`<div class="hand" role="img" aria-label="参考手牌">${tiles.map(id=>tile(id)).join('')}</div>`;
const table=()=>`<div class="table" aria-label="対局卓の概念図。製品の3D卓ではありません"><span class="seat north">Ren<b>24,500</b></span><span class="seat west">Aya<b>25,000</b></span><span class="seat east">Nori<b>24,500</b></span><span class="seat south">You / Mika<b>26,000</b></span><div class="wall" aria-hidden="true">${'<i></i>'.repeat(10)}</div><div class="wall side" aria-hidden="true">${'<i></i>'.repeat(8)}</div><div class="wall side right" aria-hidden="true">${'<i></i>'.repeat(8)}</div><div class="center-device"><b>East 2</b><span>Honba 0　Kyotaku 0</span><span>Wall 59</span></div><div class="dora">Dora indicator ${tile('Pin1')}</div><div class="rivers">${['Man1','Pin2','Sou6','Nan','Man7'].map(id=>tile(id)).join('')}</div>${hand()}</div>`;
const row=(name,info,extra='')=>`<div class="row"><span class="name">${name}</span><span>${info}${extra?` <small>${extra}</small>`:''}</span></div>`;
const screens={
 entry:{label:'入口',html:()=>`<section class="surface entry active"><div class="entry-copy"><span class="eyebrow">自分たちの卓へ</span><h1 class="title">コードを入れて、<br>対局へ。</h1><p class="lede">招待された Room に入るだけ。参加にはアカウントは必要ありません。</p><div class="entry-form"><label for="code">Room コード</label><div class="field"><input id="code" value="246810" readonly aria-label="Room コードの表示例"><span class="btn">Room を開く →</span></div></div><span class="small">Room を管理する場合は Admin サインイン</span></div><div class="entry-art" aria-label="牌と卓素材の方向性">${hand()}</div></section>`},
 lobby:{label:'Lobby',html:()=>`<section class="surface active"><header class="screen-head"><div><span class="eyebrow">Room 246810</span><h1 class="title">Saturday table</h1><p class="lede">4人の Player が選出されました。開始を待っています。</p></div><span class="pill">接続中</span></header><div class="lobby-grid"><div class="card lobby-hero"><span class="eyebrow">あなたの準備</span><h2 class="title">まだ準備していません。</h2><p class="lede">選出済み。４人の Player が揃いました。</p><span class="btn accent">準備完了にする</span><div class="rule"></div><h3>参加者</h3><div class="roster">${row('Mika / あなた','選出済み','準備前')}${row('Ren','選出済み','準備完了')}${row('Aya','選出済み','準備完了')}${row('Nori','選出済み','準備前')}</div></div><div class="lobby-side"><div class="card"><span class="eyebrow">あなたの Character</span><div class="portrait"><img src="../../tests/fixtures/task12-characters/player-red/portrait.webp" alt="仮の Character 素材"></div><h3>Player Red</h3><p class="small">仮素材。人物の描画様式はこの方向の選択後に検討します。</p></div><div class="card"><h3>Room の状況</h3><p class="lede">Lobby → 対局 → Post-Match</p><span class="small">参加者の詳細・操作主体などは補助情報</span></div></div></div></section>`},
 live:{label:'Live Match',html:()=>`<section class="surface active"><header class="screen-head"><div><span class="eyebrow">Room 246810 / 対局中</span><h1 class="title">East 2</h1></div><span class="pill">接続中　/　設定</span></header><div class="live-layout">${table()}<div class="action-strip"><div class="state"><strong>Nori の打牌に応答</strong><small>7萬に対して Pon または Pass</small></div><span class="count">29s</span><span class="btn accent">Pon</span><span class="btn secondary">Pass</span></div><aside class="live-rail"><div class="card"><span class="eyebrow">Player</span><h3>点数</h3>${row('Mika','26,000')}${row('Aya','25,000')}${row('Ren','24,500')}${row('Nori','24,500')}</div><div class="card"><span class="eyebrow">補助</span><p class="small">音量・対局詳細はここから開く。観戦時には合法アクションを表示しない。</p></div></aside></div></section>`},
 replay:{label:'Replay',html:()=>`<section class="surface active"><header class="screen-head"><div><span class="eyebrow">Replay ライブラリへ戻る</span><h1 class="title">Saturday table</h1><p class="lede">East 2 / Event 36　Nori の打牌</p></div><span class="pill">保存された Match</span></header><div class="replay-layout"><div>${table()}<div class="replay-controls"><span class="btn accent">再生 ▶</span><span class="btn secondary">← 前</span><span class="btn secondary">次 →</span><span class="pill">速度 1×</span><span class="pill">Kyoku へ移動</span></div></div><aside class="card"><h2>この出来事</h2><div class="rule"></div><p class="lede">Nori が 7萬を捨てました。</p><div class="rule"></div><span class="small">全イベント履歴を表示 ↓</span><div class="event-list">${row('35','Mika の自摸')}${row('36','Nori の打牌')}${row('37','Ren の鳴き')}</div></aside></div></section>`},
 result:{label:'Post-Match',html:()=>`<section class="surface active"><header class="screen-head"><div><span class="eyebrow">Match 終了 / East 4</span><h1 class="title">最終順位</h1></div><span class="pill">Room に戻る →</span></header><div class="result-layout"><div class="champion"><span class="eyebrow">総合 1 位</span><h2>Mika</h2><p>最後の局の和了者とは別に、Match 全体で最も高い順位の Player を祝う。得点は一覧で一度だけ表示。</p></div><div class="card result-scores"><h2>全員の結果</h2><div class="rule"></div><div class="row"><span><span class="place">1</span>Mika</span><span class="score">45,000<small>+20,000</small></span></div><div class="row"><span><span class="place">2</span>Nori</span><span class="score">30,000<small>+5,000</small></span></div><div class="row"><span><span class="place">3</span>Ren</span><span class="score">15,000<small>-10,000</small></span></div><div class="row"><span><span class="place">4</span>Aya</span><span class="score">10,000<small>-15,000</small></span></div><p class="small">Room に戻った後も、結果を再確認できます。</p></div></div></section>`},
 admin:{label:'Admin',html:()=>`<section class="surface active"><header class="screen-head"><div><span class="eyebrow">Room の管理</span><h1 class="title">開催中の Room</h1></div><span class="btn accent">Room を作成</span></header><div class="admin-grid"><aside><h2>Room を選ぶ</h2><div class="card"><strong>Saturday table</strong><p class="small">246810 / Lobby / 4人</p></div><div class="card"><strong>East side</strong><p class="small">173905 / 対局中 / 3人</p></div><span class="small">Replay ライブラリ　・　Bot Token</span></aside><article><div class="card"><span class="eyebrow">Saturday table / Lobby</span><h2>4人の Player が選出されています。</h2><p class="lede">3人が準備完了。あと1人の準備を待っています。</p><div class="facts"><span>Mode <b>4p red East</b></span><span>Room コード <b>246810</b></span></div><div class="room-steps"><span>Room 作成</span><span>選出</span><span>Ready</span><span>Match 開始</span></div><span class="btn accent">開始条件を確認</span></div><div class="card"><h2>選出された Player</h2>${row('Mika','準備前')}${row('Ren','準備完了')}${row('Aya','準備完了')}${row('Nori','準備完了')}<span class="small">設定・Participant 詳細・Bot Token は補助導線から</span></div></article></div></section>`}
};
const directions={a:{name:'A / 明るい工房',context:'手で触れる卓と、静かな道具',note:'青みのある明るい場。木・紙の安易な懐古ではなく、牌と卓の手触りを主役にする。'},b:{name:'B / 競技の情報',context:'試合を読む明快な記録',note:'数字と進行が瞬時に読める競技の文法。暗い放送卓や金縁の再現ではない。'},c:{name:'C / 遊びの祝祭',context:'友人と囲む高揚感',note:'大胆な形と色で集う楽しさを出す。重要な点数と操作は背景に埋もれさせない。'}};
function show(){const url=new URL(location.href),v=directions[url.searchParams.get('variant')]?url.searchParams.get('variant'):'a',s=screens[url.searchParams.get('surface')]?url.searchParams.get('surface'):'live';document.querySelector('#probe').dataset.variant=v;document.querySelector('#direction-name').textContent=directions[v].name;document.querySelector('#direction-context').textContent=directions[v].context;document.querySelector('#direction-note').textContent=directions[v].note;document.querySelector('#screen').innerHTML=screens[s].html();document.querySelector('#surface-nav').innerHTML=Object.entries(screens).map(([id,screen])=>`<button type="button" data-surface="${id}" ${s===id?'aria-current="page"':''}>${screen.label}</button>`).join('');}
function change(key,value){const u=new URL(location.href);u.searchParams.set(key,value);history.pushState(null,'',u);show();}
document.querySelector('#surface-nav').addEventListener('click',e=>{const b=e.target.closest('button[data-surface]');if(b)change('surface',b.dataset.surface)});
function step(n){const keys=Object.keys(directions),current=new URLSearchParams(location.search).get('variant')||'a';change('variant',keys[(keys.indexOf(current)+n+keys.length)%keys.length])}
document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
addEventListener('popstate',show);show();
</script>
</body></html>
