<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Riichi / 静かな卓（検討用）</title>
<style>
/* THROWAWAY: one unapproved visual direction. Canvas is illustrative, not the production R3F scene. */
@font-face{font-family:Geist;src:url('../assets/fonts/Geist-Variable.woff2') format('woff2');font-display:swap;font-weight:100 900}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;font-family:Geist,system-ui,sans-serif}button,input,select{font:inherit}a{color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #207e73;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:root{--paper:#e9eeeb;--ink:#19312c;--sub:#4b6760;--line:#9ab0a8;--accent:#17675d;--felt:#294a43;--tile:#f4f5e9}
body{background:var(--paper);color:var(--ink)}.site{min-height:100dvh;display:flex;flex-direction:column}.mark{display:inline-flex;align-items:center;gap:12px;font-size:15px;font-weight:750;text-decoration:none}.mark b{display:grid;place-items:center;width:35px;height:35px;background:var(--ink);color:var(--tile);font-size:20px}.site-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 auto;width:min(100%,980px);padding:26px clamp(20px,4vw,48px)}.site-header a:not(.mark){font-size:14px;color:var(--sub)}.page{width:min(100%,740px);padding:clamp(28px,6vh,74px) 24px 75px;margin:auto}.page h1{font-size:clamp(34px,5vw,60px);line-height:1.08;letter-spacing:-.05em;margin:0 0 26px}.page h2{font-size:24px;line-height:1.15;margin:0}.page p{margin:0}.muted{color:var(--sub)}.meta{font-size:14px;color:var(--sub);margin:0 0 12px!important}.field{display:grid;gap:9px;max-width:440px;margin:24px 0}.field label,.choice legend{font-size:14px;font-weight:650}.field input{height:54px;padding:0 15px;background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--ink);font-size:18px}.cta{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border:0;border-radius:3px;background:var(--ink);color:white;font-weight:650;text-decoration:none;white-space:nowrap}.cta:hover{background:var(--accent)}.cta:disabled{opacity:.5}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.secondary:hover{background:#dbe5df}.link{display:block;width:max-content;margin-top:25px;color:var(--sub);font-size:14px}.error{max-width:440px;margin:12px 0!important;color:#8a2927;font-weight:600}.choice{border:0;padding:0;margin:28px 0}.choice legend{margin-bottom:10px}.choice-row{display:flex;gap:9px;flex-wrap:wrap}.choice label{cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);border-radius:3px;min-height:54px}.choice label:has(input:checked){border:2px solid var(--accent);background:#dce9e2}.choice label:focus-within{outline:3px solid var(--accent);outline-offset:3px}.choice input{accent-color:var(--accent);width:18px;height:18px}.rows{margin:20px 0 27px;padding:0;list-style:none}.rows li{display:flex;justify-content:space-between;gap:16px;padding:15px 1px;border-bottom:1px solid var(--line);font-size:16px}.rows li span:last-child{font-variant-numeric:tabular-nums}.stage{display:flex;justify-content:space-between;align-items:end;gap:18px}.stage .meta{margin:0!important}.room-list a{text-decoration:none}.room-list a:hover{text-decoration:underline}.section-link{margin-top:25px;color:var(--sub);font-size:14px}.result-first{display:flex;align-items:baseline;gap:18px;margin-bottom:44px}.result-first strong{font-size:clamp(58px,11vw,108px);line-height:1;letter-spacing:-.08em}.result-first span{font-size:19px}.room-list{max-width:560px}
/* Live and Replay fill the viewport. Only accessible, indispensable DOM sits above the canvas. */
.table-screen{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;background:#1a2926;color:#f3f6ed}.table-screen canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}.table-screen .on-top{position:absolute;z-index:1}.table-screen .match-facts{inset-block-start:max(17px,env(safe-area-inset-top));inset-inline-start:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 1px 5px #112521}.match-facts strong{display:block;font-size:18px}.match-facts small{font-size:12px;color:#d5e4d9}.seat{font-size:13px;line-height:1.28;text-shadow:0 1px 5px #112521}.seat strong{display:block;font-size:17px;font-variant-numeric:tabular-nums}.seat.north{top:15%;left:50%;transform:translateX(-50%);text-align:center}.seat.west{top:46%;left:max(18px,env(safe-area-inset-left))}.seat.east{top:46%;right:max(18px,env(safe-area-inset-right));text-align:right}.seat.south{bottom:21%;left:max(18px,env(safe-area-inset-left))}.settings{top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}.icon{display:grid;place-items:center;width:46px;height:46px;border:1px solid #d6e4da;border-radius:3px;background:#19312c;color:#fff;font-size:23px;cursor:pointer;list-style:none}.icon::marker{content:''}.icon::-webkit-details-marker{display:none}.settings-panel{position:absolute;right:0;top:55px;min-width:200px;padding:20px;background:#19312c;border:1px solid #bacfc3;color:white}.settings-panel a{display:block;margin-top:16px}.settings-panel label{display:block;margin-top:13px}.settings-panel button{margin-top:14px}.decision{bottom:max(90px,env(safe-area-inset-bottom));right:max(20px,env(safe-area-inset-right));display:flex;align-items:center;gap:8px}.decision .count{margin-right:8px;font-size:17px;font-variant-numeric:tabular-nums}.table-screen button{min-width:50px;min-height:46px}.table-screen .cta{background:#e9eee5;color:#1b302b}.table-screen .cta.secondary{background:#19312c;color:#fff;border:1px solid #9cb2a6}.table-screen .cta:hover{background:white;color:#1b302b}.table-notice{left:50%;top:30%;transform:translateX(-50%);max-width:min(90vw,470px);padding:20px;background:#19312c;border:1px solid #c8d8cb;color:white;text-align:center}.table-notice p{margin:9px 0}.table-notice button{margin-top:12px}.replay-bar{bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px;background:#19312c;border:1px solid #98aea2}.replay-bar button{min-width:46px}.replay-bar input{width:clamp(80px,19vw,240px);accent-color:#c9dfce}.replay-bar label{white-space:nowrap;font-size:13px}.replay-extra{bottom:92px;right:max(18px,env(safe-area-inset-right))}.replay-extra summary{list-style:none;cursor:pointer;border:1px solid #b7cbbd;background:#19312c;padding:12px;color:white}.replay-extra[open]{padding:15px;max-width:260px;background:#19312c;border:1px solid #b7cbbd}.replay-extra[open] summary{padding:0;border:0}.replay-extra p{margin-top:12px;font-size:13px}.replay-extra a{display:block;margin-top:12px}.table-error{top:max(72px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#19312c;padding:14px 18px;max-width:90%;font-size:14px}.prototype{position:fixed;z-index:20;bottom:9px;left:9px;color:#162a27;font-size:12px}.prototype summary{display:block;width:max-content;cursor:pointer;background:#e9eeeb;padding:9px;border:1px solid #79958c}.prototype[open]{background:#e9eeeb;padding:12px;border:1px solid #79958c;box-shadow:0 4px 16px #0003}.prototype[open] summary{border:0;padding:0 0 8px}.prototype nav{display:flex;gap:8px;flex-wrap:wrap;max-width:530px}.prototype a{color:inherit}.capture .prototype{display:none}
@media(max-width:700px){.page{margin:0 auto;padding-top:50px}.site-header{padding:18px 22px}.seat{font-size:11px}.seat strong{font-size:13px}.seat.south{bottom:22%}.seat.north{top:13%}.decision{left:50%;right:auto;transform:translateX(-50%)}.replay-extra{bottom:102px}.decision{bottom:max(80px,env(safe-area-inset-bottom))}.replay-bar{gap:5px;padding:5px}.replay-bar label{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<details class="prototype"><summary>試作画面</summary><nav aria-label="試作の画面切替"><a href="?surface=entry">入口</a><a href="?surface=join">参加</a><a href="?surface=lobby">Lobby</a><a href="?surface=live">Live</a><a href="?surface=replay">Replay</a><a href="?surface=result">結果</a><a href="?surface=admin">Admin</a></nav></details>
<script>
// All names, scores, tiles and actions here are illustrative and disconnected from the authoritative game.
const root=document.getElementById('app'),params=new URLSearchParams(location.search),surface=params.get('surface')||'live';
if(params.has('capture'))document.body.classList.add('capture');
const url=s=>`?surface=${s}`,header=back=>`<header class="site-header"><a class="mark" href="${url('entry')}"><b aria-hidden="true">二</b>Double Riichi</a>${back?`<a href="${url(back)}">戻る</a>`:''}</header>`;
const page=(back,body)=>`<div class="site">${header(back)}<main class="page">${body}</main></div>`;
const names=['Mika','Nori','Ren','Aya'];
const scenes={
 entry:()=>page('',`<h1>ルームに入る</h1><form id="entry-form"><div class="field"><label for="room-code">ルームコード</label><input id="room-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6桁" required aria-describedby="code-error"><p id="code-error" class="error" hidden role="alert">6桁のコードを入力してください。</p></div><button class="cta" type="submit">入る</button></form><a class="link" href="${url('admin')}">主催する</a>`),
 join:()=>page('entry',`<p class="meta">ルーム 246810 · 参加できます</p><h1>Saturday table</h1><form id="join-form"><div class="field"><label for="nickname">表示名</label><input id="nickname" name="nickname" maxlength="64" autocomplete="nickname" required placeholder="名前を入力"></div><fieldset class="choice"><legend>Character</legend><div class="choice-row"><label><input type="radio" name="character" value="red" checked>赤</label><label><input type="radio" name="character" value="blue">青</label><label><input type="radio" name="character" value="green">緑</label></div></fieldset><button class="cta" type="submit">参加する</button></form>`),
 lobby:()=>page('join',`<p class="meta">ルーム 246810 · 4人戦</p><h1>Saturday table</h1><div class="stage"><h2>あなたの準備</h2><span class="muted">4 / 4 席</span></div><ul class="rows" aria-label="参加者"><li><span>Mika（あなた）</span><span>未準備</span></li><li><span>Nori</span><span>準備完了</span></li><li><span>Ren</span><span>準備完了</span></li><li><span>Aya</span><span>準備完了</span></li></ul><button class="cta" id="ready" type="button">準備完了にする</button><a class="section-link" href="${url('result')}">前回の結果を見る</a>`),
 result:()=>page('lobby',`<p class="meta">対局終了</p><h1>最終順位</h1><div class="result-first"><strong>Mika</strong><span>総合１位</span></div><ol class="rows"><li><span>1　Mika</span><span>45,000　+20,000</span></li><li><span>2　Nori</span><span>30,000　+5,000</span></li><li><span>3　Ren</span><span>15,000　−10,000</span></li><li><span>4　Aya</span><span>10,000　−15,000</span></li></ol><a class="cta" href="${url('lobby')}">ルームへ戻る</a>`),
 admin:()=>page('entry',`<p class="meta">主催者</p><div class="stage"><h1>ルーム</h1><details><summary>新規作成</summary><p class="muted">作成フォームはこの試作では省略</p></details></div><ul class="rows room-list"><li><a href="#selected">Saturday table</a><span>Lobby</span></li><li><a href="#selected">East side</a><span>対局中</span></li></ul><section id="selected"><p class="meta">Saturday table · 246810</p><div class="stage"><h2>4席 選出済み</h2><a class="cta" href="${url('live')}">対局を始める</a></div><p class="section-link">3人が準備完了</p><details class="section-link"><summary>ルーム設定と参加者</summary><p>4人戦 · 東風戦 · 観戦あり</p><p>${names.join(' / ')}</p></details><details class="section-link"><summary>Bot Token</summary><p>トークンの発行と確認</p></details><a class="link" href="${url('replay')}">Replay を開く</a></section>`)
};
if(scenes[surface])root.innerHTML=scenes[surface]();
else if(surface==='live'||surface==='replay'){
 const replay=surface==='replay',spectator=params.get('audience')==='spectator',offline=params.get('state')==='offline';
 root.innerHTML=`<main class="table-screen" aria-label="${replay?'Replay':'対局'}"><canvas id="table" aria-hidden="true"></canvas><div class="on-top match-facts"><strong>東二局</strong><small>本場 0　供託 0　残り 59</small></div><div class="on-top seat north">Ren<strong>24,500</strong></div><div class="on-top seat west">Aya<strong>25,000</strong></div><div class="on-top seat east">Nori<strong>24,500</strong></div><div class="on-top seat south">${spectator?'観戦中':'Mika（あなた）'}<strong>26,000</strong></div><details class="on-top settings"><summary class="icon" role="button" aria-label="設定と詳細">⋯</summary><div class="settings-panel"><strong>${replay?'Replay':'対局'}の詳細</strong><p>ドラ表示牌: 一筒</p><p>局と点数は卓に表示中</p><a href="${url(replay?'admin':'lobby')}">戻る</a></div></details>${offline?'<div class="on-top table-error" role="alert">接続が切れました。再接続中です。最後に受信した局面を表示しています。</div>':''}${replay?`<div class="on-top replay-bar" aria-label="Replay 操作"><button type="button" class="cta secondary" id="previous" aria-label="前の出来事">‹</button><button type="button" class="cta" id="play" aria-label="再生">▶</button><button type="button" class="cta secondary" id="next" aria-label="次の出来事">›</button><label for="position">Nori の打牌 <output id="event-number">36</output></label><input id="position" aria-label="出来事の位置" type="range" min="1" max="72" value="36"></div><details class="on-top replay-extra"><summary>履歴・速度</summary><p>35 自摸　36 打牌　37 ポン</p><label>再生速度 <select aria-label="再生速度"><option>1×</option><option>0.5×</option><option>2×</option></select></label><label>局へ移動 <select aria-label="局へ移動"><option>東二局</option><option>東一局</option></select></label><a href="${url('admin')}">Replay 一覧へ</a></details>`:!spectator&&!offline?`<div class="on-top decision" aria-label="選べる操作"><span class="count" aria-label="残り29秒">29秒</span><button type="button" class="cta" id="call">ポン</button><button type="button" class="cta secondary" id="pass">見送る</button></div>`:spectator?'<p class="on-top table-error" role="status">Nori の打牌待ち</p>':''}<div class="on-top table-notice" id="notice" role="status" hidden></div></main>`;
 const images={};for(const id of ['Man1','Man2','Man3','Man4','Man7','Pin1','Pin2','Pin4','Pin5-Dora','Pin6','Sou2','Sou3','Sou6','Nan','Chun']){images[id]=new Image();images[id].src=`../assets/tiles/Regular/${id}.svg`;images[id].onload=draw}
 const hand=['Man2','Man3','Man4','Pin4','Pin5-Dora','Pin6','Sou2','Sou3','Chun','Chun','Chun','Man7','Man7'];
 function draw(){const canvas=document.getElementById('table');if(!canvas)return;const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#1a2926';ctx.fillRect(0,0,w,h);ctx.fillStyle='#294a43';ctx.beginPath();ctx.moveTo(w*.035,0);ctx.lineTo(w*.965,0);ctx.lineTo(w,Math.min(48,h*.075));ctx.lineTo(w,h-Math.min(38,h*.065));ctx.lineTo(w*.965,h);ctx.lineTo(w*.035,h);ctx.lineTo(0,h-Math.min(38,h*.065));ctx.lineTo(0,Math.min(48,h*.075));ctx.fill();ctx.strokeStyle='#68857a';ctx.lineWidth=2;ctx.strokeRect(w*.035,h*.055,w*.93,h*.89);
 const size=Math.min(h*.072,w*.062,66),small=Math.min(size*.48,28);
 function tile(id,x,y,tw,th,rotate=0,face=true){ctx.save();ctx.translate(x,y);ctx.rotate(rotate);ctx.fillStyle=face?'#f4f5e9':'#d9ded0';ctx.fillRect(-tw/2,-th/2+3,tw,th);ctx.fillStyle='#a4b5a7';ctx.fillRect(-tw/2,th/2-3,tw,4);ctx.strokeStyle='#c5d5c7';ctx.lineWidth=1;ctx.strokeRect(-tw/2,-th/2,tw,th);if(face&&images[id]?.complete&&images[id].naturalWidth)ctx.drawImage(images[id],-tw/2+2,-th/2+2,tw-4,th-8);else if(!face){ctx.fillStyle='#4c7368';ctx.fillRect(-tw/2+3,-th/2+3,tw-6,th-9)}ctx.restore()}
 for(let i=0;i<15;i++){tile(i===11?'Pin1':'',w/2+(i-7)*small*.93,h*.23,small,small*.58,0,i===11);tile('',w/2+(i-7)*small*.93,h*.25,small,small*.58,0,false)}
 for(let i=0;i<11;i++){tile('',w*.21,h*.49+(i-5)*small*.88,small,small*.6,Math.PI/2,false);tile('',w*.79,h*.49+(i-5)*small*.88,small,small*.6,Math.PI/2,false)}
 ['Man1','Pin2','Sou6','Nan','Man7','Pin1','Sou2','Pin4','Chun'].forEach((id,i)=>tile(id,w/2+(i%5-2)*small*.82,h*.58+Math.floor(i/5)*small*1.21,small*.73,small));
 ['Pin1','Pin2','Man1','Chun','Sou6'].forEach((id,i)=>tile(id,w/2+(i-2)*small*.75,h*.32,small*.69,small*.94,Math.PI));
 if(!spectator){const gap=size*.88;hand.forEach((id,i)=>tile(id,w/2+(i-6)*gap+(i===12?size*.32:0),h-size*.89-(replay?h*.12:0),size*.81,size*1.23))}
 }
 addEventListener('resize',draw);draw();
 if(replay){const input=document.getElementById('position'),out=document.getElementById('event-number');input.addEventListener('input',()=>out.value=input.value);document.getElementById('previous').onclick=()=>{input.value=Math.max(1,Number(input.value)-1);out.value=input.value};document.getElementById('next').onclick=()=>{input.value=Math.min(72,Number(input.value)+1);out.value=input.value};document.getElementById('play').onclick=e=>{e.currentTarget.textContent=e.currentTarget.textContent==='▶'?'Ⅱ':'▶';e.currentTarget.setAttribute('aria-label',e.currentTarget.textContent==='▶'?'再生':'一時停止')}}
 else if(!spectator&&!offline){for(const id of ['call','pass'])document.getElementById(id).onclick=()=>{document.querySelector('.decision').hidden=true;const notice=document.getElementById('notice');notice.hidden=false;notice.innerHTML=`<p>${id==='call'?'ポン':'見送り'}を選択しました</p>`}}
}else root.innerHTML=scenes.entry();
const entry=document.getElementById('entry-form');if(entry)entry.onsubmit=e=>{e.preventDefault();if(/^\d{6}$/.test(document.getElementById('room-code').value))location.href=url('join');else document.getElementById('code-error').hidden=false};
const join=document.getElementById('join-form');if(join)join.onsubmit=e=>{e.preventDefault();if(join.reportValidity())location.href=url('lobby')};
const ready=document.getElementById('ready');if(ready)ready.onclick=()=>{ready.textContent='準備完了';ready.disabled=true};
if(surface==='live'||surface==='replay'){const bounds=document.querySelector('#table').getBoundingClientRect();console.assert(bounds.x===0&&bounds.y===0&&bounds.width===innerWidth&&bounds.height===innerHeight,'Canvas must fill the viewport');}
</script>
</body>
</html>
