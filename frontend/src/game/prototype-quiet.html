<style>
/* Hallmark · macrostructure: game-stage · tone: tactile / playful · anchor hue: blue-green · unapproved throwaway prototype */

*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:clip}body{font-family:var(--font-body);color:var(--ink);background:var(--paper)}[hidden]{display:none!important}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.page-shell{position:relative;max-width:1280px;min-height:calc(100dvh - 96px);margin:auto;padding:clamp(34px,7vh,92px) clamp(22px,4.4vw,68px) 76px;display:flex;align-items:center}.page{position:relative;z-index:2;width:min(50%,550px)}.page h1{font-family:var(--font-display);font-size:clamp(38px,4.2vw,62px);line-height:1.13;letter-spacing:-.068em;margin:0 0 26px;font-weight:850;overflow-wrap:anywhere;min-width:0}.page h2{font-family:var(--font-display);font-size:23px;line-height:1.2;letter-spacing:-.045em;margin:0}.page p{margin:0}.meta{font-size:13px;font-weight:750;color:var(--muted);margin:0 0 13px!important;letter-spacing:.025em}.muted{color:var(--muted)}.page .hint{font-size:16px;line-height:1.65;max-width:380px;margin:-10px 0 27px;color:var(--muted)}.field{display:grid;gap:9px;max-width:430px;margin:22px 0 18px}.field label,.choice legend{font-size:14px;font-weight:750}.field input{height:58px;padding:0 18px;background:var(--paper-light);border:2px solid var(--rule);border-radius:6px;color:var(--ink);font-size:18px;min-width:0}.field input::placeholder{color:var(--muted)}.field input:focus{border-color:var(--accent)}.cta{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border:2px solid var(--wood-dark);border-radius:5px;background:var(--accent);box-shadow:0 4px 0 var(--wood-dark);color:var(--white);font-weight:800;text-decoration:none;white-space:nowrap;transition:transform .18s var(--ease-out),background .18s var(--ease-out)}.cta:hover{background:var(--wood)}.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}.cta:disabled{opacity:.55;box-shadow:none}.secondary{background:var(--paper-light);color:var(--ink)}.secondary:hover{background:var(--tile)}.link{display:block;width:max-content;max-width:100%;margin-top:27px;font-size:14px;font-weight:750;text-underline-offset:4px}.link:hover{color:var(--accent)}.error{max-width:430px;margin:10px 0!important;color:var(--accent);font-weight:700}.choice{border:0;padding:0;margin:22px 0 24px}.choice legend{margin-bottom:12px}.choice-row{display:flex;gap:10px;flex-wrap:wrap}.choice label{cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 15px;border:2px solid var(--rule);background:var(--paper-light);border-radius:5px;min-height:54px;font-weight:700}.choice label:has(input:checked){border-color:var(--accent);background:var(--tile)}.choice label:focus-within{outline:3px solid var(--focus);outline-offset:3px}.choice input{accent-color:var(--accent);width:18px;height:18px}.rows{margin:17px 0 27px;padding:0;list-style:none;max-width:550px}.rows li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:15px;font-weight:650}.rows li span:last-child{font-variant-numeric:tabular-nums;text-align:right}.stage{display:flex;justify-content:space-between;align-items:end;gap:18px}.stage .meta{margin:0!important}.room-list a{text-decoration:none;border-bottom:1px solid var(--muted)}.room-list a:hover{color:var(--accent)}.section-link{margin-top:24px;color:var(--muted);font-size:14px}.result-first{display:flex;align-items:baseline;gap:16px;margin:5px 0 28px}.result-first strong{font-size:clamp(48px,7vw,92px);line-height:1;letter-spacing:-.075em}.result-first span{font-weight:750}.page details summary{cursor:pointer;font-weight:750}.page details[open]{padding-bottom:8px}.page details p{margin-top:10px;line-height:1.6}.site[data-surface="admin"] .page{width:min(58%,620px)}

.still-life{position:absolute;z-index:0;right:-10%;top:5%;width:65%;height:95%;pointer-events:none;transform:rotate(-12deg)}.stage-shadow{position:absolute;inset:7% -18% -25% 10%;border-radius:50%;background:var(--shadow);opacity:.12;filter:blur(35px)}.stage-board{position:absolute;inset:12% -16% -20% 9%;background:var(--felt);border:clamp(15px,2.8vw,43px) solid var(--wood);border-radius:22%;box-shadow:0 0 0 6px var(--wood-dark),inset 0 0 0 6px var(--felt-light),inset 0 0 45px var(--felt-dark),-15px 28px 0 var(--wood-dark),-15px 40px 30px var(--shadow)}.stage-board::before{content:"";position:absolute;inset:9%;border:1px solid var(--felt-light);opacity:.65}.stage-board::after{content:"";position:absolute;left:39%;top:36%;width:22%;height:21%;background:var(--felt-dark);border:4px solid var(--wood-light);box-shadow:5px 9px 0 var(--wood-dark);border-radius:9px}.still-life .piece{position:absolute;width:clamp(42px,5vw,72px);aspect-ratio:.73;background:var(--tile);border-radius:7px;border:2px solid var(--tile-edge);border-bottom:9px solid var(--wood-light);box-shadow:3px 9px 0 var(--wood-dark),5px 14px 8px var(--shadow);display:grid;place-items:center}.still-life .piece img{display:block;width:85%;height:85%;object-fit:contain}.piece:nth-of-type(3){left:20%;top:32%;transform:rotate(-7deg)}.piece:nth-of-type(4){left:30%;top:27%;transform:rotate(6deg)}.piece:nth-of-type(5){left:42%;top:24%;transform:rotate(1deg)}.piece:nth-of-type(6){left:54%;top:27%;transform:rotate(-4deg)}.piece:nth-of-type(7){left:64%;top:33%;transform:rotate(9deg)}.piece:nth-of-type(8){left:44%;top:60%;transform:rotate(100deg)}.piece:nth-of-type(9){left:54%;top:62%;transform:rotate(96deg)}.site[data-surface="join"] .still-life{transform:rotate(12deg) scale(.92);right:-13%}.site[data-surface="lobby"] .still-life{transform:rotate(-8deg) scale(.9);top:4%}.site[data-surface="result"] .still-life{transform:rotate(7deg) scale(.95)}.site[data-surface="admin"] .still-life{transform:rotate(-14deg) scale(.78);r .table-screen{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;color:var(--tile);background:var(--felt-dark)}.table-screen canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}.table-screen .on-top{position:absolute;z-index:1}.match-facts{top:max(13px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;background:var(--felt-dark);border:1px solid var(--wood-light);border-radius:6px;padding:5px 20px;box-shadow:0 3px 0 var(--wood-dark)}.match-facts strong{display:block;font-size:18px;font-weight:800}.match-facts small{font-size:12px;color:var(--tile)}.seat{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border:1px solid var(--wood-light);border-radius:6px;background:var(--felt-dark);box-shadow:0 3px 0 var(--wood-dark);font-size:12px;line-height:1.2;white-space:nowrap}.seat .token{display:grid;place-items:center;width:31px;height:31px;border-radius:4px;background:var(--tile);color:var(--accent);font-weight:850;font-size:17px;box-shadow:0 3px 0 var(--tile-edge)}.seat strong{display:block;font-size:17px;font-variant-numeric:tabular-nums;color:var(--white)}.seat.north{top:11%;left:50%;transform:translateX(-50%)}.seat.west{top:43%;left:max(12px,env(safe-area-inset-left))}.seat.east{top:43%;right:max(12px,env(safe-area-inset-right))}.seat.south{bottom:10%;left:max(12px,env(safe-area-inset-left))}.settings{top:max(13px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}.icon{display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--wood-light);border-radius:6px;background:var(--felt-dark);color:var(--tile);font-size:23px;list-style:none;cursor:pointer}.icon::marker{content:''}.icon::-webkit-details-marker{display:none}.settings-panel{position:absolute;right:0;top:54px;min-width:210px;padding:20px;background:var(--felt-dark);border:1px solid var(--wood-light);color:var(--white);box-shadow:0 8px 20px var(--shadow)}.settings-panel a{display:block;margin-top:16px}.settings-panel label{display:block;margin-top:13px}.settings-panel button{margin-top:14px}.decision{bottom:max(106px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap}.decision .count{margin-right:5px;background:var(--felt-dark);padding:10px;border-radius:6px;font-weight:800;font-variant-numeric:tabular-nums}.table-screen button{min-width:50px;min-height:46px}.table-screen .cta{background:var(--accent);color:var(--white);border-color:var(--wood-dark)}.table-screen .cta.secondary{background:var(--tile);color:var(--ink);border-color:var(--wood-dark)}.table-screen .cta:hover{background:var(--wood-light);color:var(--ink)}.table-notice{left:50%;top:31%;transform:translateX(-50%);max-width:min(90vw,470px);padding:18px;background:var(--felt-dark);border:1px solid var(--wood-light);color:var(--white);text-align:center}.table-notice p{margin:9px 0}.replay-bar{bottom:max(103px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px;background:var(--felt-dark);border:1px solid var(--wood-light);border-radius:7px;box-shadow:0 4px 0 var(--wood-dark);white-space:nowrap}.replay-bar button{min-width:46px;padding-inline:12px}.replay-bar input{width:clamp(80px,17vw,200px);accent-color:var(--accent-light)}.replay-bar label{font-size:13px}.replay-extra{top:max(82px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}.replay-extra summary{list-style:none;cursor:pointer;border:1px solid var(--wood-light);background:var(--felt-dark);padding:11px;color:var(--white);border-radius:6px}.replay-extra[open]{padding:15px;max-width:260px;background:var(--felt-dark);border:1px solid var(--wood-light)}.replay-extra[open] summary{padding:0;border:0}.replay-extra p{margin-top:12px;font-size:13px}.replay-extra a{display:block;margin-top:12px}.table-error{top:max(72px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--felt-dark);border:1px solid var(--wood-light);padding:14px 18px;max-width:90%;font-size:14px}
.prototype{position:fixed;z-index:20;bottom:9px;left:9px;color:var(--ink);font-size:12px}.prototype summary{display:block;width:max-content;cursor:pointer;background:var(--tile);padding:9px;border:1px solid var(--wood)}.prototype[open]{background:var(--tile);padding:12px;border:1px solid var(--wood);box-shadow:0 4px 16px var(--shadow)}.prototype[open] summary{border:0;padding:0 0 8px}.prototype nav{display:flex;gap:8px;flex-wrap:wrap;max-width:530px}.capture .prototype{display:none}

@media(max-width:700px){.site-header{padding:16px 22px}.page-shell{padding-top:42px;align-items:flex-start;display:block}.page,.site[data-surface="admin"] .page{width:100%;max-width:560px}.page h1{font-size:clamp(36px,10vw,52px)}.still-life{top:auto!important;bottom:-280px;left:20%;right:auto!important;width:100%;height:450px;transform:rotate(-12deg) scale(.82)!important;opacity:.6}.site{padding-bottom:140px}.seat{font-size:10px;padding:3px;gap:4px}.seat strong{font-size:12px}.seat .token{width:21px;height:21px;font-size:12px}.seat.north{top:12%}.seat.south{bottom:11%}.seat.east,.seat.west{top:40%}.decision{bottom:max(83px,env(safe-area-inset-bottom))}.replay-bar{gap:4px;padding:4px;bottom:max(81px,env(safe-area-inset-bottom))}.replay-bar label{font-size:10px}.replay-bar button{min-width:40px;padding-inline:6px}.replay-extra{top:202px}}

<body>
<div id="app"></div>
<details class="prototype"><summary>試作画面</summary><nav aria-label="試作の画面切替"><a href="?surface=entry">入口</a><a href="?surface=join">参加</a><a href="?surface=lobby">Lobby</a><a href="?surface=live">Live</a><a href="?surface=replay">Replay</a><a href="?surface=result">結果</a><a href="?surface=admin">Admin</a></nav></details>
<script>
// THROWAWAY: all names, scores, tiles and actions are illustrative, never authoritative.
const root=document.getElementById('app'),params=new URLSearchParams(location.search),surface=params.get('surface')||'live';
if(params.has('capture'))document.body.classList.add('capture');
const url=s=>`?surface=${s}`,header=back=>`<header class="site-header"><a class="mark" href="${url('entry')}"><b aria-hidden="true">二</b>Double Riichi</a>${back?`<a class="back" href="${url(back)}">← 戻る</a>`:''}</header>`;
const stillLife=`<div class="still-life" aria-hidden="true"><div class="stage-shadow"></div><div class="stage-board"></div>${['Man1','Man2','Man3','Pin5-Dora','Sou6','Chun','Ton'].map(id=>`<div class="piece"><img src="../assets/tiles/Regular/${id}.svg" alt=""></div>`).join('')}</div>`;
const page=(back,body)=>`<div class="site" data-surface="${surface}">${header(back)}<div class="page-shell"><main class="page">${body}</main>${stillLife}</div></div>`;
const names=['Mika','Nori','Ren','Aya'];
const scenes={
 entry:()=>page('',`<p class="meta">四人で囲む、一つの卓</p><h1>ルームに入る</h1><p class="hint">招待されたルームのコードを入力してください。</p><form id="entry-form"><div class="field"><label for="room-code">ルームコード</label><input id="room-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6桁のコード" required aria-describedby="code-error"><p id="code-error" class="error" hidden role="alert">6桁のコードを入力してください。</p></div><button class="cta" type="submit">入る</button></form><a class="link" href="${url('admin')}">自分でルームを作る</a>`),
 join:()=>page('entry',`<p class="meta">ルーム 246810 · 参加できます</p><h1>Saturday table</h1><form id="join-form"><div class="field"><label for="nickname">表示名</label><input id="nickname" name="nickname" maxlength="64" autocomplete="nickname" required placeholder="名前を入力"></div><fieldset class="choice"><legend>Character</legend><div class="choice-row"><label><input type="radio" name="character" value="red" checked>赤</label><label><input type="radio" name="character" value="blue">青</label><label><input type="radio" name="character" value="green">緑</label></div></fieldset><button class="cta" type="submit">参加する</button></form>`),
 lobby:()=>page('join',`<p class="meta">ルーム 246810 · 4人戦</p><h1>Saturday table</h1><div class="stage"><h2>あなたの準備</h2><span class="muted">4 / 4 席</span></div><ul class="rows" aria-label="参加者"><li><span>Mika（あなた）</span><span>未準備</span></li><li><span>Nori</span><span>準備完了</span></li><li><span>Ren</span><span>準備完了</span></li><li><span>Aya</span><span>準備完了</span></li></ul><button class="cta" id="ready" type="button">準備完了にする</button><a class="link" href="${url('result')}">前回の結果を見る</a>`),
 result:()=>page('lobby',`<p class="meta">対局終了</p><h1>最終順位</h1><div class="result-first"><strong>Mika</strong><span>総合１位</span></div><ol class="rows"><li><span>1　Mika</span><span>45,000　+20,000</span></li><li><span>2　Nori</span><span>30,000　+5,000</span></li><li><span>3　Ren</span><span>15,000　−10,000</span></li><li><span>4　Aya</span><span>10,000　−15,000</span></li></ol><a class="cta" href="${url('lobby')}">ルームへ戻る</a>`),
 admin:()=>page('entry',`<p class="meta">主催者</p><div class="stage"><h1>ルーム</h1><details><summary>新規作成</summary><p class="muted">作成フォームはこの試作では省略</p></details></div><ul class="rows room-list"><li><a href="#selected">Saturday table</a><span>Lobby</span></li><li><a href="#selected">East side</a><span>対局中</span></li></ul><section id="selected"><p class="meta">Saturday table · 246810</p><div class="stage"><h2>4席 選出済み</h2><a class="cta" href="${url('live')}">対局を始める</a></div><p class="section-link">3人が準備完了</p><details class="section-link"><summary>ルーム設定と参加者</summary><p>4人戦 · 東風戦 · 観戦あり</p><p>${names.join(' / ')}</p></details><details class="section-link"><summary>Bot Token</summary><p>トークンの発行と確認</p></details><a class="link" href="${url('replay')}">Replay を開く</a></section>`)
};
if(scenes[surface])root.innerHTML=scenes[surface]();
else if(surface==='live'||surface==='replay'){
 const replay=surface==='replay',spectator=params.get('audience')==='spectator',offline=params.get('state')==='offline';
 const seat=(place,name,score,initial)=>`<div class="on-top seat ${place}"><span class="token" aria-hidden="true">${initial}</span><span>${name}<strong>${score}</strong></span></div>`;
 root.innerHTML=`<main class="table-screen" aria-label="${replay?'Replay':'対局'}"><canvas id="table" aria-hidden="true"></canvas><div class="on-top match-facts"><strong>東二局</strong><small>本場 0　供託 0　残り 59</small></div>${seat('north','Ren','24,500','北')}${seat('west','Aya','25,000','西')}${seat('east','Nori','24,500','東')}${seat('south',spectator?'観戦中':'Mika（あなた）','26,000','南')}<details class="on-top settings"><summary class="icon" role="button" aria-label="設定と詳細">⋯</summary><div class="settings-panel"><strong>${replay?'Replay':'対局'}の詳細</strong><p>ドラ表示牌: 一筒</p><p>局と点数は卓に表示中</p><a href="${url(replay?'admin':'lobby')}">戻る</a></div></details>${offline?'<div class="on-top table-error" role="alert">接続が切れました。再接続中です。最後に受信した局面を表示しています。</div>':''}${replay?`<div class="on-top replay-bar" aria-label="Replay 操作"><button type="button" class="cta secondary" id="previous" aria-label="前の出来事">‹</button><button type="button" class="cta" id="play" aria-label="再生">▶</button><button type="button" class="cta secondary" id="next" aria-label="次の出来事">›</button><label for="position">Nori の打牌 <output id="event-number">36</output></label><input id="position" aria-label="出来事の位置" type="range" min="1" max="72" value="36"></div><details class="on-top replay-extra"><summary>履歴・速度</summary><p>35 自摸　36 打牌　37 ポン</p><label>再生速度 <select aria-label="再生速度"><option>1×</option><option>0.5×</option><option>2×</option></select></label><label>局へ移動 <select aria-label="局へ移動"><option>東二局</option><option>東一局</option></select></label><a href="${url('admin')}">Replay 一覧へ</a></details>`:!spectator&&!offline?`<div class="on-top decision" aria-label="選べる操作"><span class="count" aria-label="残り29秒">29秒</span><button type="button" class="cta" id="call">ポン</button><button type="button" class="cta secondary" id="pass">見送る</button></div>`:spectator?'<p class="on-top table-error" role="status">Nori の打牌待ち</p>':''}<div class="on-top table-notice" id="notice" role="status" hidden></div></main>`;
 const images={};for(const id of ['Man1','Man2','Man3','Man4','Man7','Pin1','Pin2','Pin4','Pin5-Dora','Pin6','Sou2','Sou3','Sou6','Nan','Chun']){images[id]=new Image();images[id].src=`../assets/tiles/Regular/${id}.svg`;images[id].onload=draw}
 const hand=['Man2','Man3','Man4','Pin4','Pin5-Dora','Pin6','Sou2','Sou3','Chun','Chun','Chun','Man7','Man7'];
 const css=getComputedStyle(document.documentElement),color=name=>css.getPropertyValue(`--${name}`).trim();
 function draw(){
  const canvas=document.getElementById('table');if(!canvas)return;
  const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const rect=(x,y,ww,hh,c)=>{ctx.fillStyle=color(c);ctx.fillRect(x,y,ww,hh)};
  const poly=(pts,c)=>{ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color(c);ctx.fill()};
  rect(0,0,w,h,'wood-dark');
  // A cutaway manufactured table. Its edges remain visible rather than becoming a flat colored background.
  poly([[0,0],[w,0],[w*.98,h*.985],[w*.02,h*.985]],'wood');
  poly([[0,h*.022],[w,h*.022],[w*.975,h*.965],[w*.025,h*.965]],'wood-light');
  poly([[w*.01,h*.037],[w*.99,h*.037],[w*.962,h*.943],[w*.038,h*.943]],'wood-dark');
  poly([[w*.025,h*.055],[w*.975,h*.055],[w*.944,h*.915],[w*.056,h*.915]],'felt');
  // Sparse fibers and one directional light give the felt a surface without masking tile faces.
  ctx.save();ctx.beginPath();ctx.moveTo(w*.025,h*.055);ctx.lineTo(w*.975,h*.055);ctx.lineTo(w*.944,h*.915);ctx.lineTo(w*.056,h*.915);ctx.closePath();ctx.clip();ctx.globalAlpha=.09;ctx.fillStyle=color('tile');for(let i=0;i<750;i++)ctx.fillRect((i*137.19%1)*w,(i*83.71%1)*h,1,1);ctx.restore();
  ctx.strokeStyle=color('felt-light');ctx.lineWidth=2;ctx.strokeRect(w*.085,h*.105,w*.83,h*.74);
  const sheen=ctx.createLinearGradient(0,h*.08,w,h*.9);sheen.addColorStop(0,color('light-ray'));sheen.addColorStop(.52,color('clear'));sheen.addColorStop(1,color('shade-ray'));ctx.fillStyle=sheen;ctx.fillRect(0,h*.06,w,h*.85);
  const size=Math.min(h*.092,w*.071,80),far=size*.59,mid=size*.43;
  function tile(id,x,y,tw,th,rotate=0,face=true){
   ctx.save();ctx.translate(x,y);ctx.rotate(rotate);ctx.shadowColor=color('shadow');ctx.shadowBlur=8;ctx.shadowOffsetY=5;
   ctx.fillStyle=color('wood-dark');ctx.beginPath();ctx.roundRect(-tw/2,-th/2+3,tw,th,Math.min(4,tw*.1));ctx.fill();ctx.shadowColor='transparent';ctx.shadowOffsetY=0;
   ctx.fillStyle=color(face?'tile':'wood-light');ctx.beginPath();ctx.roundRect(-tw/2,-th/2,tw,th-4,Math.min(4,tw*.1));ctx.fill();
   ctx.strokeStyle=color(face?'tile-edge':'wood-dark');ctx.lineWidth=1;ctx.stroke();
   if(face&&images[id]?.complete&&images[id].naturalWidth)ctx.drawImage(images[id],-tw/2+tw*.08,-th/2+th*.06,tw*.84,th*.76);
   else if(!face){ctx.fillStyle=color('felt-dark');ctx.fillRect(-tw*.37,-th*.38,tw*.74,th*.64)}ctx.restore()
  }
  // Seat walls, short rivers and the hand have independent scale; the lower hand is always the first read.
  for(let i=0;i<14;i++)tile('',w/2+(i-6.5)*far*.92,h*.188,far,far*.72,0,false);
  for(let i=0;i<11;i++){tile('',w*.19,h*.51+(i-5)*mid*.85,mid,mid*.72,Math.PI/2,false);tile('',w*.81,h*.51+(i-5)*mid*.85,mid,mid*.72,Math.PI/2,false)}
  ['Man1','Pin2','Sou6','Nan','Man7','Pin1','Sou2','Pin4','Chun'].forEach((id,i)=>tile(id,w/2+(i%5-2)*mid*.95,h*.59+Math.floor(i/5)*mid*1.4,mid*.88,mid*1.18));
  ['Pin1','Pin2','Man1','Chun','Sou6'].forEach((id,i)=>tile(id,w/2+(i-2)*mid*.92,h*.32,mid*.85,mid*1.17,Math.PI));
  ctx.save();ctx.translate(w/2,h*.455);ctx.shadowColor=color('shadow');ctx.shadowBlur=12;ctx.shadowOffsetY=6;ctx.fillStyle=color('wood-dark');ctx.beginPath();ctx.roundRect(-size*1.23,-size*.92,size*2.46,size*1.84,10);ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=color('wood-light');ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=color('felt-dark');ctx.beginPath();ctx.roundRect(-size*1.04,-size*.73,size*2.08,size*1.46,6);ctx.fill();ctx.fillStyle=color('tile');ctx.font=`700 ${Math.max(10,size*.15)}px ${css.getPropertyValue('--font-body')}`;ctx.textAlign='center';ctx.fillText('ドラ',0,-size*.39);ctx.restore();
  tile('Pin1',w/2,h*.47,size*.48,size*.57);
  if(!spectator){const gap=Math.min(size*.76,(w-70)/14);hand.forEach((id,i)=>tile(id,w/2+(i-6)*gap+(i===12?size*.27:0),h-size*.63,size*.72,size*1.13))}
 }
 addEventListener('resize',draw);draw();
 if(replay){const input=document.getElementById('position'),out=document.getElementById('event-number');input.addEventListener('input',()=>out.value=input.value);document.getElementById('previous').onclick=()=>{input.value=Math.max(1,Number(input.value)-1);out.value=input.value};document.getElementById('next').onclick=()=>{input.value=Math.min(72,Number(input.value)+1);out.value=input.value};document.getElementById('play').onclick=e=>{e.currentTarget.textContent=e.currentTarget.textContent==='▶'?'Ⅱ':'▶';e.currentTarget.setAttribute('aria-label',e.currentTarget.textContent==='▶'?'再生':'一時停止')}}
 else if(!spectator&&!offline){for(const id of ['call','pass'])document.getElementById(id).onclick=()=>{document.querySelector('.decision').hidden=true;const notice=document.getElementById('notice');notice.hidden=false;notice.innerHTML=`<p>${id==='call'?'ポン':'見送り'}を選択しました</p>`}}
}else root.innerHTML=scenes.entry();
const entry=document.getElementById('entry-form');if(entry)entry.onsubmit=e=>{e.preventDefault();if(/^\d{6}$/.test(document.getElementById('room-code').value))location.href=url('join');else document.getElementById('code-error').hidden=false};
const join=document.getElementById('join-form');if(join)join.onsubmit=e=>{e.preventDefault();if(join.reportValidity())location.href=url('lobby')};
const ready=document.getElementById('ready');if(ready)ready.onclick=()=>{ready.textContent='準備完了';ready.disabled=true};
if(surface==='live'||surface==='replay'){const bounds=document.querySelector('#table').getBoundingClientRect();console.assert(bounds.x===0&&bounds.y===0&&bounds.width===innerWidth&&bounds.height===innerHeight,'Canvas must fill the viewport')}
</script>
</body>
</html>
