[package]
name = "double_riichi_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
argon2 = { version = "=0.5.3", features = ["std"] }
base64 = "=0.22.1"
double_riichi_core = { path = "../double_riichi_core" }
double_riichi_mcp = { path = "../double_riichi_mcp" }
double_riichi_mjai = { path = "../double_riichi_mjai" }
double_riichi_replay = { path = "../double_riichi_replay" }
rand = "=0.10.2"
rpassword = "=7.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "=2.0.20"
tracing = "=0.1.44"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "=0.8.23"
url = "=2.5.8"
zeroize = "=1.9.0"
rust-embed = "=8.12.0"

[[bin]]
name = "driichi"
path = "src/main.rs"

[lints]
workspace = true
