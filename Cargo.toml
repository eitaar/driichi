[workspace]
members = [
    "crates/double_riichi_core",
    "crates/double_riichi_server",
    "crates/double_riichi_mjai",
    "crates/double_riichi_mcp",
    "crates/double_riichi_replay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
