name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0

jobs:
  test-all:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14

      - name: Set up Rust
        shell: bash
        run: >
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt

      - name: Install just
        shell: bash
        run: cargo install just --version 1.40.0 --locked

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install browser runtime
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version

      - name: Run deterministic local gates
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: just test-all
