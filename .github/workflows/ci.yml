name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0

jobs:
  test-mcp-task14:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        shell: bash
        run: >
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt
      - name: Run task14 MCP integration tests
        run: cargo +"$RUST_TOOLCHAIN" test -p double_riichi_server --test task14_mcp
      - name: Run ChatGPT MCP gateway integration tests
        run: cargo +"$RUST_TOOLCHAIN" test -p double_riichi_server --test chatgpt_mcp
      - name: Run ChatGPT OAuth HTTP integration tests
        run: cargo +"$RUST_TOOLCHAIN" test -p double_riichi_server --test chatgpt_oauth
      - name: Run admin HTTP regression tests
        run: cargo +"$RUST_TOOLCHAIN" test -p double_riichi_server --test task9_http
      - name: Run server library tests
        run: cargo +"$RUST_TOOLCHAIN" test -p double_riichi_server --lib

  test-local:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14

      - name: Read pinned Yamai revision
        id: yamai-contract
        shell: bash
        run: |
          revision=$(python -c "import tomllib; print(tomllib.load(open('spec/external-contracts.toml', 'rb'))['yamai']['revision'])")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Yamai
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: eitaar/yamai
          ref: ${{ steps.yamai-contract.outputs.revision }}
          path: .cache/yamai/${{ steps.yamai-contract.outputs.revision }}
          token: ${{ secrets.YAMAI_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Rust
        shell: bash
        run: >
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install just
        shell: bash
        run: cargo install just --version 1.40.0 --locked

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run deterministic local gates
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: just check test-yamai

  test-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14

      - name: Set up Rust
        shell: bash
        run: >
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install just
        shell: bash
        run: cargo install just --version 1.40.0 --locked

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install browser runtime
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run browser gates
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: just test-e2e

  test-real:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust
        shell: bash
        run: >
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install browser runtime
        run: npx --prefix frontend playwright install --with-deps chromium
      # Keep cold dependency compilation outside the bounded service-start fixture.
      - name: Build real-service frontend
        run: npm run build --prefix frontend
      - name: Build Task8 release dependencies
        timeout-minutes: 25
        env:
          CARGO_TARGET_DIR: target/task8-be72f5cf
        run: cargo build --release --locked -p double_riichi_server --features task8-test-support -j 1
      - name: Run real-service browser gates
        run: npm run test:browser:real --prefix frontend

  test-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install browser runtime
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Verify built Dedicated Worker renderer
        shell: bash
        run: |
          set -euo pipefail
          evidence=$(mktemp -d "$RUNNER_TEMP/driichi-native-worker.XXXXXXXX")
          export DRIICHI_WORKER_PROBE_DIST="$evidence/dist"
          echo "Native renderer evidence: $evidence"
          trap 'sha256sum "$evidence"/*.log' EXIT
          cd frontend
          timeout --signal=TERM --kill-after=10s 180s npx --no-install vite build \
            --config tests/support/renderer-worker-build.config.ts --outDir "$DRIICHI_WORKER_PROBE_DIST" \
            2>&1 | tee "$evidence/build.log"
          timeout --signal=TERM --kill-after=10s 720s npx --no-install playwright test \
            --config=playwright.worker.config.ts --output "$evidence/test-results" \
            2>&1 | tee "$evidence/browser.log"

  # Preserve the required check name; every independent gate must actually succeed.
  test-all:
    needs: [test-local, test-browser, test-real, test-worker, test-mcp-task14]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Require every gate to succeed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.test-local.result }}" = success
          test "${{ needs.test-browser.result }}" = success
          test "${{ needs.test-real.result }}" = success
          test "${{ needs.test-worker.result }}" = success
          test "${{ needs.test-mcp-task14.result }}" = success
