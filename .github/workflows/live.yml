name: Scheduled compatibility

on:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test-live:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14

      - name: Install just
        shell: bash
        run: cargo install just --version 1.40.0 --locked

      - name: Run the explicitly scheduled live gate
        env:
          RUN_LIVE_TESTS: "1"
          RIICHI_LOCAL_BASE_URL: ${{ secrets.RIICHI_LOCAL_BASE_URL }}
          RIICHI_LOCAL_AUTH_KEY: ${{ secrets.RIICHI_LOCAL_AUTH_KEY }}
          RIICHI_DEV_BASE_URL: ${{ secrets.RIICHI_DEV_BASE_URL }}
          RIICHI_DEV_AUTH_KEY: ${{ secrets.RIICHI_DEV_AUTH_KEY }}
          RIICHI_PRODUCTION_BOT_COMMAND: >-
            ${{ secrets.RIICHI_PRODUCTION_BOT_COMMAND }}
        shell: bash
        # Missing local/external Bot evidence fails closed as unclaimed.
        run: just test-live
