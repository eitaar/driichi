name: Fix commit attribution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-commit-authors.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rewrite Pi Agent attribution
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
          if [ "$GIT_AUTHOR_EMAIL" = "pi-agent@local" ]; then
            export GIT_AUTHOR_NAME="eitaar"
            export GIT_AUTHOR_EMAIL="154091730+eitaar@users.noreply.github.com"
          fi
          if [ "$GIT_COMMITTER_EMAIL" = "pi-agent@local" ]; then
            export GIT_COMMITTER_NAME="eitaar"
            export GIT_COMMITTER_EMAIL="154091730+eitaar@users.noreply.github.com"
          fi
          ' -- main

          git config user.name "eitaar"
          git config user.email "154091730+eitaar@users.noreply.github.com"
          git rm .github/workflows/fix-commit-authors.yml
          git commit -m "chore: remove temporary author-fix workflow"
          git push --force origin main
