name: Fix commit attribution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-commit-authors.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rewrite only Pi Agent email attribution
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          EXPECTED_SHA="$(git rev-parse HEAD)"
          ORIGINAL_SHA="0dd25ad06637660529e75719ca6b38a5f508b685"
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$EXPECTED_SHA" != "$REMOTE_SHA" ]; then
            echo "main changed since checkout; refusing to rewrite a stale branch"
            exit 1
          fi
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
          if [ "$GIT_AUTHOR_EMAIL" = "pi-agent@local" ]; then
            export GIT_AUTHOR_NAME="eitaar"
            export GIT_AUTHOR_EMAIL="154091730+eitaar@users.noreply.github.com"
          fi
          if [ "$GIT_COMMITTER_EMAIL" = "pi-agent@local" ]; then
            export GIT_COMMITTER_NAME="eitaar"
            export GIT_COMMITTER_EMAIL="154091730+eitaar@users.noreply.github.com"
          fi
          ' -- main

          git config user.name "eitaar"
          git config user.email "154091730+eitaar@users.noreply.github.com"
          git rm .github/workflows/fix-commit-authors.yml
          git commit -m "chore: remove temporary author-fix workflow"

          if git log --format='%ae%n%ce' main | grep -Fxq 'pi-agent@local'; then
            echo "Pi Agent email remains on main; refusing to publish"
            exit 1
          fi
          git diff --quiet "${ORIGINAL_SHA}^{tree}" HEAD^{tree} || {
            echo "Repository tree differs from the original main; refusing to publish"
            exit 1
          }
          git push --force-with-lease=refs/heads/main:"$EXPECTED_SHA" origin main
