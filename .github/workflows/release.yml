name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14

      - name: Set up Rust
        shell: bash
        run: >
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt

      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ffmpeg

      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ffmpeg --no-progress --yes

      - name: Test release scripts
        shell: bash
        run: python scripts/release/test_release.py

      - name: Build and stage release
        shell: bash
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          python scripts/release/package.py build \
            --platform "${{ matrix.platform }}" \
            --output target/release-artifacts

      - name: Verify release archive without host-specific execution
        shell: bash
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          version="$(python - <<'PY'
          import re
          text = open("Cargo.toml", encoding="utf-8").read()
          print(re.search(r'^version = "([^"]+)"$', text, re.M).group(1))
          PY
          )"
          archive_dir=target/release-artifacts
          archive_name="double-riichi-${version}-${{ matrix.platform }}"
          archive="$archive_dir/$archive_name.zip"
          python scripts/release/smoke.py "$archive" \
            --platform "${{ matrix.platform }}" \
            --version "$version" \
            --commit "$GIT_COMMIT" \
            --dry-run
          test ! -e character-packs
          test ! -e character-packs-1.0.0.zip

      - name: Run native version/start smoke
        shell: bash
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          version="$(python - <<'PY'
          import re
          text = open("Cargo.toml", encoding="utf-8").read()
          print(re.search(r'^version = "([^"]+)"$', text, re.M).group(1))
          PY
          )"
          archive_dir=target/release-artifacts
          archive_name="double-riichi-${version}-${{ matrix.platform }}"
          archive="$archive_dir/$archive_name.zip"
          python scripts/release/smoke.py "$archive" \
            --platform "${{ matrix.platform }}" \
            --version "$version" \
            --commit "$GIT_COMMIT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: double-riichi-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/release-artifacts/*.zip
            target/release-artifacts/*.sha256
