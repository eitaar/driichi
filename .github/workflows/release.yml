name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("Cargo.toml").read_text(encoding="utf-8")
          version = re.search(r'^version = "([^"]+)"$', text, re.M).group(1)
          actual = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match Cargo version {expected!r}")
          PY

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14

      - name: Set up Rust target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component rustfmt
          rustup target add --toolchain "$RUST_TOOLCHAIN" "${{ matrix.target }}"

      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ffmpeg --no-progress --yes

      - name: Test release scripts
        shell: bash
        run: python scripts/release/test_release.py

      - name: Prove release-mode frontend embedding
        shell: bash
        run: python scripts/release/production_frontend.py

      - name: Build and stage release
        shell: bash
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          python scripts/release/package.py build \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --output target/release-artifacts

      - name: Verify release archive without host-specific execution
        shell: bash
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          version="$(python - <<'PY'
          import re
          text = open("Cargo.toml", encoding="utf-8").read()
          print(re.search(r'^version = "([^"]+)"$', text, re.M).group(1))
          PY
          )"
          archive_dir=target/release-artifacts
          archive_name="double-riichi-${version}-${{ matrix.platform }}"
          archive="$archive_dir/$archive_name.zip"
          python scripts/release/smoke.py "$archive" \
            --platform "${{ matrix.platform }}" \
            --version "$version" \
            --commit "$GIT_COMMIT" \
            --dry-run
          starter_version="$(python - "$archive" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as bundle:
              print(bundle.read("character-packs/STARTER_VERSION").decode().strip())
          PY
          )"
          starter_zip="$archive_dir/character-packs-${starter_version}.zip"
          test -f "$starter_zip"
          test -f "$starter_zip.sha256"
          PYTHONPATH=scripts/release \
            python - "$starter_zip" "$starter_version" <<'PY'
          import sys
          from pathlib import Path
          import package
          import smoke
          starter_zip = Path(sys.argv[1])
          smoke._verify_published_checksum(starter_zip)
          package._verify_starter_zip(starter_zip, sys.argv[2])
          PY
          test ! -e character-packs
          test ! -e character-packs-${starter_version}.zip

      - name: Run native version/start smoke
        shell: bash
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          version="$(python - <<'PY'
          import re
          text = open("Cargo.toml", encoding="utf-8").read()
          print(re.search(r'^version = "([^"]+)"$', text, re.M).group(1))
          PY
          )"
          archive_dir=target/release-artifacts
          archive_name="double-riichi-${version}-${{ matrix.platform }}"
          archive="$archive_dir/$archive_name.zip"
          python scripts/release/smoke.py "$archive" \
            --platform "${{ matrix.platform }}" \
            --version "$version" \
            --commit "$GIT_COMMIT"

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: double-riichi-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/release-artifacts/double-riichi-*-${{ matrix.platform }}.zip
            target/release-artifacts/double-riichi-*-${{ matrix.platform }}.zip.sha256

      - name: Upload standalone Starter Pack
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: double-riichi-starter
          if-no-files-found: error
          path: |
            target/release-artifacts/character-packs-*.zip
            target/release-artifacts/character-packs-*.zip.sha256

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: double-riichi-*
          path: target/release-artifacts
          merge-multiple: true

      - name: Publish tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifacts=(target/release-artifacts/*.zip target/release-artifacts/*.sha256)
          test "${#artifacts[@]}" -eq 8
          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Double Riichi ${GITHUB_REF_NAME}"
